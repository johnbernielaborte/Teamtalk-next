name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.28.6-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28.6' }}
          name: "TeamTalk Next v5.28.6"
          body: |
            ### TeamTalk Next v5.28.6 — Система плагинов, ID каналов, полная документация и примеры

            > [!NOTE]
            > **Выложена вся кодовая база проекта!** Репозиторий содержит полный стек:
            > - **`client/`** — Android-клиент TeamTalk Next со всеми возможностями, модификациями и системой плагинов.
            > - **`doc/`** — Полная документация по созданию плагинов на русском (`doc/ru/`) и английском (`doc/en/`) языках.
            > - **`tests/`** — Примеры и тесты плагинов (`EchoBotPlugin`, `UtilityCommandsPlugin`, `ChannelLoggerPlugin`) со скриптом сборки.
            > - **`sdk/`** — исходный код TeamTalk 5 SDK (C++ core, JNI, Java, .NET, Python, Rust биндинги).
            > - **`server/`** — серверные компоненты (yt-dlp stream resolver).

            #### 🔌 Полноценная система плагинов (Plugin Architecture):
            - **Динамическая загрузка:** Поддержка загрузки внешних `.jar` и `.dex` плагинов на базе `DexClassLoader` с изоляцией исключений и защитой от сбоев.
            - **Совместимость с Android 14+ (API 34+):** Поддержка правил безопасности Dynamic Code Loading (DCL) со строгим контролем прав чтения (`setReadOnly`) и защищенным изолированным кэшем.
            - **API для разработчиков (`PluginContext` & `PluginEventListener`):** Доступ к `TeamTalkBase`, `TeamTalkService`, отправке сообщений, перехвату событий каналов, пользователей, аудиопередачи и созданию кастомных UI-кнопок (`PluginAction`).
            - **Слэш-команды в чате:** Возможность регистрации собственных slash-команд (например, `/ping`, `/roll`, `/channelid`, `/calc`).
            - **Встроенный интерфейс:** Экран управления плагинами («Менеджер плагинов») с возможностью установки сторонних плагинов через системный проводник, включения/выключения на лету и удаления.

            #### 📍 Улучшения работы с каналами:
            - **Просмотр ID канала:** В свойствах канала (`ChannelPropActivity`) добавлен блок с отображением числового идентификатора (`#ID`) и кнопкой копирования в буфер обмена.
            - **Присоединение по ID:** Добавлен пункт меню и диалог быстрого перехода в канал по его числовому ID (с поддержкой пароля).

            #### 📚 Документация и примеры:
            - **`doc/`:** 6 подробных тематических руководств на русском (`doc/ru/`) и английском (`doc/en/`) языках (архитектура, быстрый старт, API reference, слэш-команды, компиляция через `d8`, установка и отладка).
            - **`tests/`:** 3 готовых тестовых плагина с исходным кодом и готовыми `.jar`.

            #### 📦 Версии:
            - **Версия приложения:** Обновлена до `5.28.6` (номер сборки `439`).
            - **Нативные библиотеки:** Библиотеки `libTeamTalk5-jni.so` (arm64-v8a, armeabi-v7a) синхронизированы с версией `5.28.6`.
          draft: false
          prerelease: false
          files: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            tests/output/*.jar
            TeamTalkNext-5.28.6-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

